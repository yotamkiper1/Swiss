<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swiss Film</title>
<style>
/* The Swiss product film (v2, 34 s): a faithful rebuild of the app's screens around the user's real files and a real
   Wikipedia page in Chrome, driven frame by frame by seek(t).
   Colours and strings come from Sources/Stash (FolderViews.swift, RecentView.swift, Store.swift…). */
:root {
  --paper: #F3F4F1;          /* the icon's background */
  --red: #DF4637;            /* the knife */
  --brown: #4C2E21;          /* the blade */
  --ink: #1D1D1F;
  --ink2: #6E6E73;
  --ink3: #A1A1A6;
  --accent: #0A7AFF;
  --win: #F6F6F5;
  --side: #EBEAE8;
  --line: rgba(0,0,0,.08);
  --folder-back: rgb(97,166,237);   /* FolderIcon.back, light */
  --folder-front: rgb(133,194,250); /* FolderIcon.front, light */
  --k-linker: rgb(28,158,117);
  --k-photos: rgb(217,89,48);
  --k-notes: rgb(240,158,38);
  --k-files: rgb(135,135,128);
  --note: #FDEDA8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--paper); overflow: hidden; }
body { font-family: Inter, -apple-system, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; letter-spacing: -0.005em; }
#stage { position: absolute; left: 0; top: 0; background: var(--paper); overflow: hidden; }
#screen { position: absolute; overflow: hidden; border-radius: 14px; background: #ddd;
  box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 18px 50px rgba(60,40,30,.16); }
.scene { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; opacity: 0; }
.abs { position: absolute; }


/* macOS bits */
.wallpaper { position: absolute; inset: 0; background:
  radial-gradient(120% 90% at 15% 10%, #E9E3DA 0%, transparent 60%),
  radial-gradient(90% 80% at 90% 90%, #D5DCE3 0%, transparent 60%),
  linear-gradient(160deg, #E6E1D9, #D8DADB); }
.menubar { position: absolute; left: 0; top: 0; width: 1280px; height: 24px; background: rgba(255,255,255,.62);
  display: flex; align-items: center; padding: 0 26px; font-size: 13px; gap: 18px; color: #1d1d1f; z-index: 50; }
.menubar b { font-weight: 700; }
.menubar .right { margin-left: auto; display: flex; gap: 14px; align-items: center; }
.window { position: absolute; background: var(--win); border-radius: 11px; overflow: hidden;
  box-shadow: 0 0 0 .5px rgba(0,0,0,.22), 0 10px 32px rgba(0,0,0,.20); }
.lights { display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.lights i:nth-child(1) { background: #FF5F57; } .lights i:nth-child(2) { background: #FEBC2E; } .lights i:nth-child(3) { background: #28C840; }
.lights.off i { background: #D6D6D6 !important; }
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; }
.key { position: absolute; background: rgba(30,30,32,.78); color: #fff; font-size: 15px; font-weight: 600; padding: 6px 11px;
  border-radius: 8px; letter-spacing: .02em; opacity: 0; white-space: nowrap; }
.flash { position: absolute; background: rgba(40,40,42,.86); color: #fff; font-size: 13px; font-weight: 500; padding: 8px 15px;
  border-radius: 20px; opacity: 0; white-space: nowrap; display: flex; gap: 7px; align-items: center; }

/* Swiss window */
.sidebar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--side); border-right: 1px solid var(--line); padding: 44px 8px 0; font-size: 13px; }
.srow { height: 26px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 6px; color: #2a2a2c; white-space: nowrap; }
.srow .n { margin-left: auto; color: var(--ink3); font-size: 11.5px; }
.srow.sel { background: rgba(10,122,255,.16); }
.srow .ic { color: var(--ink2); font-size: 14px; }
.shead { font-size: 11px; font-weight: 600; color: var(--ink3); padding: 14px 8px 4px; display: flex; }
.shead span { margin-left: auto; }
.dotc { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.toolbar { position: absolute; height: 34px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); }
.search { height: 26px; border-radius: 7px; background: rgba(0,0,0,.055); display: flex; align-items: center; gap: 6px; padding: 0 9px; color: var(--ink3); font-size: 13px; }
.pill { height: 24px; border-radius: 6px; background: rgba(0,0,0,.05); display: flex; align-items: center; gap: 5px; padding: 0 8px; color: #3a3a3c; font-size: 12.5px; }
.tabs { position: absolute; left: 0; right: 0; top: 0; height: 40px; background: rgba(0,0,0,.035); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 4px; padding: 0 12px; font-size: 13px; }
.tab { height: 28px; padding: 0 14px; border-radius: 7px; display: flex; align-items: center; gap: 7px; color: #59595d; }
.tab.sel { background: rgba(10,122,255,.14); color: #1d1d1f; font-weight: 600; }
.quickbar { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding: 0 14px; font-size: 12px; color: #4a4a4e; }
.quickbar small { color: var(--ink3); font-size: 10px; margin-right: 3px; }

/* Folder tile */
.ftile { position: absolute; width: 96px; text-align: center; font-size: 12.5px; font-weight: 500; color: #2a2a2c; }
.ficon { position: relative; margin: 0 auto; }
.ficon .back1 { position: absolute; left: 0; top: 0; background: var(--folder-back); }
.ficon .back2 { position: absolute; left: 0; right: 0; bottom: 0; background: var(--folder-back); }
.ficon .front { position: absolute; left: 0; right: 0; bottom: 0; background: var(--folder-front); }
.ficon .kdot { position: absolute; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.92); display: flex; align-items: center; justify-content: center; color: #fff; }
.ficon .num { position: absolute; left: -9px; top: -7px; width: 15px; height: 15px; border-radius: 4px; border: 1px solid rgba(0,0,0,.25); font-size: 9.5px; line-height: 13px; color: #555; background: rgba(255,255,255,.6); font-weight: 600; }
.ficon .count { position: absolute; right: -7px; top: -7px; min-width: 18px; height: 18px; border-radius: 9px; background: #5d5d61; color: #fff; font-size: 10px; font-weight: 700; line-height: 18px; padding: 0 4px; border: 1.5px solid #f6f6f5; }
.ftile .label { margin-top: 7px; white-space: nowrap; }

/* Cards */
.card { position: absolute; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.07), 0 2px 6px rgba(0,0,0,.05); }
.card .meta { padding: 9px 12px; font-size: 12.5px; }
.card .t { font-weight: 600; color: #1d1d1f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .h { color: var(--ink2); font-size: 11.5px; margin-top: 3px; display: flex; align-items: center; gap: 4px; }
.notecard { background: #F1F0EE; padding: 14px 16px; font-family: "DejaVu Serif", Georgia, serif; font-size: 14.5px; line-height: 1.4; color: #262626; }
.notecard .q { font-size: 22px; color: #9a9a9a; line-height: 1; height: 14px; font-family: Georgia, serif; }
.notecard .ago { font-family: Inter, sans-serif; font-size: 11px; color: var(--ink3); margin-top: 8px; }

/* Recent list */
.rrow { position: absolute; left: 0; right: 0; height: 54px; display: flex; align-items: center; gap: 11px; padding: 0 14px; border-radius: 8px; }
.rrow .th { width: 38px; height: 38px; border-radius: 7px; flex: none; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 1px rgba(0,0,0,.06); }
.rrow .tt { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rrow .st { font-size: 11.5px; color: var(--ink2); margin-top: 2px; white-space: nowrap; display: flex; gap: 4px; align-items: center; }
.rrow.sel { background: rgba(10,122,255,.85); }
.rrow.sel .tt, .rrow.sel .st { color: #fff; }

/* Finder list */
.frow { height: 26px; display: flex; align-items: center; font-size: 12.5px; padding: 0 12px; gap: 8px; }
.frow:nth-child(even) { background: rgba(0,0,0,.03); }
.frow .d { margin-left: auto; color: var(--ink2); width: 150px; }
#captions { position: absolute; left: 0; width: 100%; }
/* v2: captions in the reference film's style (red eyebrow, headline, chips) and red highlight rings */
.cap { position: absolute; left: 0; width: 100%; opacity: 0; text-align: center; }
.cap .eye { color: var(--red); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.cap .h1 { margin-top: 8px; font-weight: 650; color: #2B2B2E; letter-spacing: -0.02em; line-height: 1.15; }
.cyc-wrap { display: inline-block; text-align: left; }
.cyc { position: relative; display: inline-block; color: var(--red); }
.cyc .w { position: absolute; left: 0; top: 0; white-space: nowrap; }
.cyc .sizer { visibility: hidden; white-space: nowrap; }
.chips { margin-top: 16px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 0 40px; }
.chip { display: inline-flex; align-items: center; gap: 8px; background: #fff; color: #3a3a3c; font-weight: 550; padding: .42em .9em; border-radius: 999px;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 2px 8px rgba(60,40,30,.06); opacity: 0; }
.chip b { color: var(--red); font-weight: 800; }
.chip.muted { background: transparent; box-shadow: 0 0 0 1px rgba(0,0,0,.12); color: #8A8A8E; }
.hl { position: absolute; border: 2.5px solid var(--red); box-shadow: 0 0 0 5px rgba(223,70,55,.13); opacity: 0; pointer-events: none; z-index: 80; }
</style>
</head>
<body>
<script src="assets/names.js"></script>
<div id="stage">
  <div id="screen"><div class="wallpaper"></div></div>
  <div id="captions"></div>
</div>
<script>
// ---------- time helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;   // cubic in-out
const eo = x => 1 - Math.pow(1 - x, 3);                                     // cubic out
const lerp = (a, b, u) => a + (b - a) * u;
const $ = (root, sel) => root.querySelector(sel);

// ---------- layout (16:9 default, ?v=1 vertical) ----------
const params = new URLSearchParams(location.search);
const VERTICAL = params.get('v') === '1';
const SW = VERTICAL ? 1080 : 1920, SH = VERTICAL ? 1920 : 1080;
const stage = document.getElementById('stage');
stage.style.width = SW + 'px'; stage.style.height = SH + 'px';
const screenEl = document.getElementById('screen');
// The Mac's screen: world 1280×720 points, shown at K px per point. Captions sit below it.
const L = VERTICAL ? { x: 40, y: 250, w: 1000, h: 1040, cap: 1350, eye: 22, h1: 54, chip: 25 }
                   : { x: 210, y: 34, w: 1500, cap: 900, eye: 15, h1: 40, chip: 17 };
L.h = L.h || L.w * 9 / 16; const K = VERTICAL ? L.w / 680 : L.w / 1280; // vertical shows a 680-point-wide crop
Object.assign(screenEl.style, { left: L.x + 'px', top: L.y + 'px', width: L.w + 'px', height: L.h + 'px' });
const caps = document.getElementById('captions'); caps.style.top = L.cap + 'px';

// ---------- icons (simplified SF Symbols) ----------
const I = {
  link: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>',
  photo: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16a1.5 1.5 0 0 1 1.5 1.5v11A1.5 1.5 0 0 1 20 19H4a1.5 1.5 0 0 1-1.5-1.5v-11A1.5 1.5 0 0 1 4 5zm1.5 11.5h13l-4.2-5.6-3.3 4.2-2.2-2.6z"/><circle cx="8" cy="9" r="1.7" fill="#fff" opacity=".9"/></svg>',
  doc: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M6 2.5h8l5 5v13a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20.5v-16A2 2 0 0 1 6 2.5z"/><path d="M14 2.5v5h5" fill="#fff" opacity=".55"/></svg>',
  lines: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg>',
  wand: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20 15 9"/><path d="M17 3v3M15.5 4.5h3M20 9v2M19 10h2M11 4v2M10 5h2"/></svg>',
  search: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>',
  clock: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v4h4"/><path d="M12 8v4l3 2"/></svg>',
  stack: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="5" y="8" width="14" height="12" rx="2"/><path d="M7 5h10M9 2.5h6"/></svg>',
  folder: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7.5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  drive: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="9" rx="2"/><path d="M12 13v4M5 20h14M8 20v-3h8v3"/></svg>',
  plus: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  sidebar: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M9 5v14"/></svg>',
  lock: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.7-1.5"/></svg>',
  frame: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="7" width="13" height="13" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg>',
  grid: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/></svg>',
  list: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.1M4.5 12h.1M4.5 18h.1"/></svg>',
  arrange: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="5" height="4" rx="1"/><rect x="10" y="5" width="5" height="4" rx="1"/><rect x="17" y="5" width="4" height="4" rx="1"/><rect x="3" y="11" width="5" height="4" rx="1"/><rect x="10" y="11" width="5" height="4" rx="1"/><rect x="17" y="11" width="4" height="4" rx="1"/></svg>',
  trash: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13"/></svg>',
  tray: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10m-4-4 4 4 4-4"/><path d="M3 14h5l1.5 3h5L16 14h5v5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19z"/></svg>',
  check: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  chev: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m7 10 5 5 5-5"/></svg>',
  pin: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M8 3h8l-1.3 6 3.3 3H6l3.3-3zM11.3 12h1.4v9h-1.4z"/></svg>',
  arrow: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M6 3.5 18.5 12 12.6 13l3.4 7-2.4 1.1-3.3-7.1L6 18z"/></svg>',
  hand: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12m0-6.5V5a1.5 1.5 0 0 1 3 0v7m0-5.5a1.5 1.5 0 0 1 3 0V13m0-4a1.5 1.5 0 0 1 3 0v5a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-2.7L4.5 14a1.5 1.5 0 0 1 2.5-1.7L8 14"/></svg>',
  minus: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  play: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
  camera: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3"/><circle cx="12" cy="12" r="3"/></svg>',
  knife: '<svg class="ic" viewBox="0 0 24 24"><path d="M10 13 19 4.5c.6 2.6-2.4 7.2-6 9z" fill="currentColor"/><rect x="3" y="12.5" width="15" height="5.2" rx="2.6" fill="currentColor"/><circle cx="15.3" cy="15.1" r="1" fill="#fff"/></svg>',
};
const kindStyle = {
  photos: { color: 'var(--k-photos)', sym: I.photo, name: 'PhotoBook' },
  linker: { color: 'var(--k-linker)', sym: I.link, name: 'Linker' },
  notes:  { color: 'var(--k-notes)',  sym: I.lines, name: 'Notepad' },
  files:  { color: 'var(--k-files)',  sym: I.doc, name: 'Files' },
  classic:{ color: null, sym: '', name: 'Folder' },
};

// The folder icon ("Dot" design, FolderViews.swift): Finder-blue folder, a coloured kind dot in the corner.
function folderIcon(kind, s, opts = {}) {
  const k = kindStyle[kind]; const d = s * 0.3;
  return `<div class="ficon" style="width:${s}px;height:${s * .8}px">
    <div class="back1" style="width:${s * .4}px;height:${s * .16}px;border-radius:${s * .06}px ${s * .06}px 0 0"></div>
    <div class="back2" style="top:${s * .1}px;border-radius:${s * .08}px"></div>
    <div class="front" style="top:${s * .24}px;border-radius:${s * .08}px"></div>
    ${k.color ? `<div class="kdot" style="width:${d}px;height:${d}px;right:${-s * .04}px;bottom:${-s * .04}px;background:${k.color};font-size:${d * .52}px">${k.sym}</div>` : ''}
    ${opts.num ? `<div class="num">${opts.num}</div>` : ''}
    ${opts.count != null ? `<div class="count" data-count>${opts.count}</div>` : ''}
  </div>`;
}
function folderTile(kind, name, x, y, opts = {}) {
  return `<div class="ftile" style="left:${x}px;top:${y}px" ${opts.id ? `id="${opts.id}"` : ''}>${folderIcon(kind, 64, opts)}
    <div class="label">${opts.tag ? `<span class="dotc" style="background:${opts.tag};margin-right:5px"></span>` : ''}${name}</div></div>`;
}

// The cursor (macOS arrow).
const cursorHTML = `<div class="cursor abs" style="left:0;top:0;width:22px;height:30px;z-index:100;transform-origin:3px 3px">
  <div class="ring abs" style="left:-13px;top:-13px;width:32px;height:32px;border-radius:50%;border:2px solid rgba(10,122,255,.0)"></div>
  <svg width="22" height="30" viewBox="0 0 22 30"><path d="M2 2v22l6-5.5 4 9 3.6-1.6-4-8.8H20z" fill="#000" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div>`;

// ---------- scene machinery ----------
// Centre of an element in its scene's world coordinates (valid before the first seek, when scenes are unscaled).
function at(sc, sel, dx = 0, dy = 0) {
  const r = $(sc.el, sel).getBoundingClientRect(), s = screenEl.getBoundingClientRect();
  return { x: r.left - s.left + r.width / 2 + dx, y: r.top - s.top + r.height / 2 + dy };
}
const scenes = [];
function scene(a, b, html, update, camera) {
  const el = document.createElement('div');
  el.className = 'scene'; el.innerHTML = html + cursorHTML;
  screenEl.appendChild(el);
  scenes.push({ a, b, el, update, camera, cursor: $(el, '.cursor') });
  return el;
}
// Camera keys: [t, zoom, cx, cy] in scene time; eased between keys.
function cam(keys, t) {
  let k = keys[0];
  if (t <= keys[0][0]) k = keys[0];
  else if (t >= keys[keys.length - 1][0]) k = keys[keys.length - 1];
  else for (let i = 0; i < keys.length - 1; i++) if (t >= keys[i][0] && t <= keys[i + 1][0]) {
    const u = io(seg(t, keys[i][0], keys[i + 1][0]));
    k = [t, lerp(keys[i][1], keys[i + 1][1], u), lerp(keys[i][2], keys[i + 1][2], u), lerp(keys[i][3], keys[i + 1][3], u)];
  }
  let [, z, cx, cy] = k;
  const S = K * z, hw = L.w / 2 / S, hh = L.h / 2 / S;
  cx = clamp(cx, hw, 1280 - hw); cy = clamp(cy, hh, 720 - hh);
  return `translate(${L.w / 2 - cx * S}px, ${L.h / 2 - cy * S}px) scale(${S})`;
}
// Cursor path: [t, x, y, click?]. Eased moves with a slight arc; a click presses for a moment.
function moveCursor(sc, keys, t) {
  const c = sc.cursor;
  if (!keys) { c.style.opacity = 0; return; }
  let x = keys[0][1], y = keys[0][2];
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, x0, y0] = keys[i], [t1, x1, y1] = keys[i + 1];
    if (t >= t0 && t <= t1) {
      const u = io(seg(t, t0, t1)), arc = Math.sin(Math.PI * u) * 0.08;
      const dx = x1 - x0, dy = y1 - y0;
      x = lerp(x0, x1, u) - dy * arc; y = lerp(y0, y1, u) + dx * arc;
    } else if (t > t1) { x = x1; y = y1; }
  }
  let press = 0, ring = 0;
  for (const k of keys) if (k[3]) {
    const d = t - k[0];
    if (d > -0.06 && d < 0.16) press = 1;
    if (d >= 0 && d < 0.5) ring = 1 - d / 0.5;
  }
  c.style.opacity = 1;
  c.style.transform = `translate(${x - 3}px, ${y - 3}px) scale(${press ? 0.88 : 1})`;
  const r = c.querySelector('.ring');
  r.style.borderColor = `rgba(10,122,255,${0.35 * ring})`;
  r.style.transform = `scale(${0.6 + (1 - ring) * 0.6})`;
}

const fadeIO = (t, a, b, d = 0.35) => Math.min(seg(t, a, a + d), 1 - seg(t, b - d, b));

function rings(sc, list) {

    return { a, b, d };

}
function drawRings(sc, t) {
  for (const r of sc.rings || []) {

}

  { a: 22.4, b: 27.2, eye: '05 · Connected folders', h: 'Work right inside any Finder folder.', chips: [['Rename, move, tag', 23.3], ['Finder follows along', 25.1]] },
  { a: 27.6, b: 30.25, eye: '06 · On your Mac', h: 'Everything in one place.', chips: [['No account', 28.2], ['No cloud', 28.4]] },
];
const capEls = CAPS.map(c => {
  const d = document.createElement('div'); d.className = 'cap';
  const eye = c.eye ? `<div class="eye" style="font-size:${L.eye}px">${c.eye}</div>` : '';
  const head = c.cycle
    ? `<div class="h1" style="font-size:${L.h1}px"><span class="cyc-wrap">${c.pre} <span class="cyc">${c.cycle.map(([w]) => `<span class="w">${w}</span>`).join('')}<span class="sizer">${c.cycle.map(([w]) => w).sort((x, y) => y.length - x.length)[0]}</span></span></span></div>`
    : `<div class="h1" style="font-size:${L.h1}px">${c.h}</div>`;
  const chips = c.chips ? `<div class="chips">${c.chips.map(([n, , muted]) => `<span class="chip ${muted ? 'muted' : ''}" style="font-size:${L.chip}px">${muted ? '' : '<b>+</b>'}${n}</span>`).join('')}</div>` : '';
  d.innerHTML = eye + head + chips;
  caps.appendChild(d); return d;
});

// ================= seek =================
const DIP = 0.3;
const WIPE_IN = [30.15, 30.55], WIPE_OUT = [30.55, 31.0];
window.DURATION = 34.0;
window.seek = function (t) {
  for (const sc of scenes) {
    const first = sc === scenes[0], last = sc === scenes[scenes.length - 1];
    const op = Math.min(first ? 1 : io(seg(t, sc.a, sc.a + DIP)), last ? 1 : 1 - io(seg(t, sc.b - DIP, sc.b)));
    sc.el.style.opacity = op;
    sc.el.style.display = op > 0 ? 'block' : 'none';
    if (op <= 0) continue;
    const lt = t - sc.a;
    sc.el.style.transform = cam(VERTICAL && sc.vcam ? sc.vcam : sc.camera, lt);
    moveCursor(sc, sc.cursorKeys, lt);
    sc.update(lt, sc.el);
    drawRings(sc, lt);
  }
  screenEl.style.opacity = io(seg(t, 0, 0.4));
  CAPS.forEach((c, i) => {
    const el = capEls[i], o = fadeIO(t, c.a, c.b, 0.3);
    el.style.opacity = o;
    el.style.display = o > 0 ? 'block' : 'none';
    const e = $(el, '.eye'), h = $(el, '.h1');
    if (e) { const u = eo(seg(t, c.a, c.a + 0.45)); e.style.transform = `translateY(${(1 - u) * 8}px)`; }
    const uh = eo(seg(t, c.a + 0.06, c.a + 0.55)); h.style.transform = `translateY(${(1 - uh) * 12}px)`;
    if (c.cycle) el.querySelectorAll('.cyc .w').forEach((w, j) => {
      const a = c.cycle[j][1], b = j + 1 < c.cycle.length ? c.cycle[j + 1][1] : c.b + 1;
      const inn = j === 0 ? 1 : eo(seg(t, a, a + 0.32)), out = eo(seg(t, b, b + 0.32));
      w.style.opacity = Math.min(inn, 1 - out);
      w.style.transform = `translateY(${(1 - inn) * 0.6 - out * 0.6}em)`;
    });
    if (c.chips) el.querySelectorAll('.chip').forEach((ch, j) => {
      const u = eo(seg(t, c.chips[j][1], c.chips[j][1] + 0.35));
      ch.style.opacity = u; ch.style.transform = `translateY(${(1 - u) * 8}px) scale(${0.96 + 0.04 * u})`;
    });
  });
  // A red diagonal wipe crosses the stage and leaves the end card behind it.
  const wi = io(seg(t, ...WIPE_IN)), wo = io(seg(t, ...WIPE_OUT));
  const W0 = -SW * 1.75, W1 = -SW * 0.3, W2 = SW * 1.2;
  wipe.style.transform = `translateX(${t < WIPE_OUT[0] ? lerp(W0, W1, wi) : lerp(W1, W2, wo)}px) skewX(-18deg)`;
  wipe.style.display = t > WIPE_IN[0] && t < WIPE_OUT[1] ? 'block' : 'none';
  endEl.style.opacity = t >= WIPE_OUT[0] ? 1 : 0;
  const ic = eo(seg(t, 30.75, 31.5)), wd = eo(seg(t, 31.0, 31.7)), ln = eo(seg(t, 31.25, 31.95)), sm = eo(seg(t, 31.5, 32.2));
  const ei = document.getElementById('endicon');
  ei.style.opacity = ic; ei.style.transform = `scale(${0.94 + 0.06 * ic})`;
  for (const [id, v] of [['endword', wd], ['endline', ln], ['endsmall', sm]]) {
    const n = document.getElementById(id); n.style.opacity = v; n.style.transform = `translateY(${(1 - v) * 10}px)`;
  }
};
scenes[0].cursorKeys = null;
// Vertical framing (a 680-point-wide crop): one calm move per scene, following the action.
[
  [[0, 1, 400, 360], [1.2, 1, 400, 360], [1.8, 1, 880, 360], [2.4, 1, 880, 360], [3.0, 1, 940, 360], [3.6, 1, 940, 360]],
  [[0, 1, 330, 360], [2.5, 1, 330, 360], [3.1, 1, 950, 360], [3.5, 1.12, 950, 340], [6.2, 1.12, 950, 340]],
  [[0, 1, 900, 360], [1.5, 1, 900, 360], [2.3, 1, 420, 360], [6, 1, 420, 360]],
  [[0, 1, 940, 360], [6.4, 1, 940, 360]],
  [[0, 1, 940, 360], [2.75, 1, 940, 360], [3.35, 1, 340, 360], [5.2, 1, 340, 360]],
  [[0, 1.04, 520, 360], [3.2, 1, 520, 360]],
].forEach((k, i) => scenes[i].vcam = k);
window.seek(params.has('t') ? +params.get('t') : 0);
