<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swiss Film</title>
<style>
/* The Swiss product film (v4, 40 s): a faithful rebuild of the app's screens on a dark stage, with kinetic titles,
   a logo intro and outro, driven frame by frame by seek(t). Pictures are freely licensed (CREDITS.md).
   Colours and strings come from Sources/Stash (FolderViews.swift, RecentView.swift, Store.swift…). */
:root {
  --paper: #F3F4F1;          /* the icon's background */
  --red: #DF4637;            /* the knife */
  --brown: #4C2E21;          /* the blade */
  --ink: #1D1D1F;
  --ink2: #6E6E73;
  --ink3: #A1A1A6;
  --accent: #0A7AFF;
  --win: #F6F6F5;
  --side: #EBEAE8;
  --line: rgba(0,0,0,.08);
  --folder-back: rgb(97,166,237);   /* FolderIcon.back, light */
  --folder-front: rgb(133,194,250); /* FolderIcon.front, light */
  --k-linker: rgb(28,158,117);
  --k-photos: rgb(217,89,48);
  --k-notes: rgb(240,158,38);
  --k-files: rgb(135,135,128);
  --note: #FDEDA8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--paper); overflow: hidden; }
body { font-family: Inter, -apple-system, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; letter-spacing: -0.005em; }
#stage { position: absolute; left: 0; top: 0; background: var(--paper); overflow: hidden; }
#screen { position: absolute; overflow: hidden; border-radius: 14px; background: #ddd;
  box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 18px 50px rgba(60,40,30,.16); }
.scene { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; opacity: 0; }
.abs { position: absolute; }


/* macOS bits */
.wallpaper { position: absolute; inset: 0; background:
  radial-gradient(120% 90% at 15% 10%, #E9E3DA 0%, transparent 60%),
  radial-gradient(90% 80% at 90% 90%, #D5DCE3 0%, transparent 60%),
  linear-gradient(160deg, #E6E1D9, #D8DADB); }
.menubar { position: absolute; left: 0; top: 0; width: 1280px; height: 24px; background: rgba(255,255,255,.62);
  display: flex; align-items: center; padding: 0 26px; font-size: 13px; gap: 18px; color: #1d1d1f; z-index: 50; }
.menubar b { font-weight: 700; }
.menubar .right { margin-left: auto; display: flex; gap: 14px; align-items: center; }
.window { position: absolute; background: var(--win); border-radius: 11px; overflow: hidden;
  box-shadow: 0 0 0 .5px rgba(0,0,0,.22), 0 10px 32px rgba(0,0,0,.20); }
.lights { display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.lights i:nth-child(1) { background: #FF5F57; } .lights i:nth-child(2) { background: #FEBC2E; } .lights i:nth-child(3) { background: #28C840; }
.lights.off i { background: #D6D6D6 !important; }
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; }
.key { position: absolute; background: rgba(30,30,32,.78); color: #fff; font-size: 15px; font-weight: 600; padding: 6px 11px;
  border-radius: 8px; letter-spacing: .02em; opacity: 0; white-space: nowrap; }
.flash { position: absolute; background: rgba(40,40,42,.86); color: #fff; font-size: 13px; font-weight: 500; padding: 8px 15px;
  border-radius: 20px; opacity: 0; white-space: nowrap; display: flex; gap: 7px; align-items: center; }

/* Swiss window */
.sidebar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--side); border-right: 1px solid var(--line); padding: 44px 8px 0; font-size: 13px; }
.srow { height: 26px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 6px; color: #2a2a2c; white-space: nowrap; }
.srow .n { margin-left: auto; color: var(--ink3); font-size: 11.5px; }
.srow.sel { background: rgba(10,122,255,.16); }
.srow .ic { color: var(--ink2); font-size: 14px; }
.shead { font-size: 11px; font-weight: 600; color: var(--ink3); padding: 14px 8px 4px; display: flex; }
.shead span { margin-left: auto; }
.dotc { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.toolbar { position: absolute; height: 34px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); }
.search { height: 26px; border-radius: 7px; background: rgba(0,0,0,.055); display: flex; align-items: center; gap: 6px; padding: 0 9px; color: var(--ink3); font-size: 13px; }
.pill { height: 24px; border-radius: 6px; background: rgba(0,0,0,.05); display: flex; align-items: center; gap: 5px; padding: 0 8px; color: #3a3a3c; font-size: 12.5px; }
.tabs { position: absolute; left: 0; right: 0; top: 0; height: 40px; background: rgba(0,0,0,.035); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 4px; padding: 0 12px; font-size: 13px; }
.tab { height: 28px; padding: 0 14px; border-radius: 7px; display: flex; align-items: center; gap: 7px; color: #59595d; }
.tab.sel { background: rgba(10,122,255,.14); color: #1d1d1f; font-weight: 600; }
.quickbar { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding: 0 14px; font-size: 12px; color: #4a4a4e; }
.quickbar small { color: var(--ink3); font-size: 10px; margin-right: 3px; }

/* Folder tile */
.ftile { position: absolute; width: 96px; text-align: center; font-size: 12.5px; font-weight: 500; color: #2a2a2c; }
.ficon { position: relative; margin: 0 auto; }
.ficon .back1 { position: absolute; left: 0; top: 0; background: var(--folder-back); }
.ficon .back2 { position: absolute; left: 0; right: 0; bottom: 0; background: var(--folder-back); }
.ficon .front { position: absolute; left: 0; right: 0; bottom: 0; background: var(--folder-front); }
.ficon .kdot { position: absolute; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.92); display: flex; align-items: center; justify-content: center; color: #fff; }
.ficon .num { position: absolute; left: -9px; top: -7px; width: 15px; height: 15px; border-radius: 4px; border: 1px solid rgba(0,0,0,.25); font-size: 9.5px; line-height: 13px; color: #555; background: rgba(255,255,255,.6); font-weight: 600; }
.ficon .count { position: absolute; right: -7px; top: -7px; min-width: 18px; height: 18px; border-radius: 9px; background: #5d5d61; color: #fff; font-size: 10px; font-weight: 700; line-height: 18px; padding: 0 4px; border: 1.5px solid #f6f6f5; }
.ftile .label { margin-top: 7px; white-space: nowrap; }

/* Cards */
.card { position: absolute; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.07), 0 2px 6px rgba(0,0,0,.05); }
.card .meta { padding: 9px 12px; font-size: 12.5px; }
.card .t { font-weight: 600; color: #1d1d1f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .h { color: var(--ink2); font-size: 11.5px; margin-top: 3px; display: flex; align-items: center; gap: 4px; }
.notecard { background: #F1F0EE; padding: 14px 16px; font-family: "DejaVu Serif", Georgia, serif; font-size: 14.5px; line-height: 1.4; color: #262626; }
.notecard .q { font-size: 22px; color: #9a9a9a; line-height: 1; height: 14px; font-family: Georgia, serif; }
.notecard .ago { font-family: Inter, sans-serif; font-size: 11px; color: var(--ink3); margin-top: 8px; }

/* Recent list */
.rrow { position: absolute; left: 0; right: 0; height: 54px; display: flex; align-items: center; gap: 11px; padding: 0 14px; border-radius: 8px; }
.rrow .th { width: 38px; height: 38px; border-radius: 7px; flex: none; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 1px rgba(0,0,0,.06); }
.rrow .tt { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rrow .st { font-size: 11.5px; color: var(--ink2); margin-top: 2px; white-space: nowrap; display: flex; gap: 4px; align-items: center; }
.rrow.sel { background: rgba(10,122,255,.85); }
.rrow.sel .tt, .rrow.sel .st { color: #fff; }

/* Finder list */
.frow { height: 26px; display: flex; align-items: center; font-size: 12.5px; padding: 0 12px; gap: 8px; }
.frow:nth-child(even) { background: rgba(0,0,0,.03); }
.frow .d { margin-left: auto; color: var(--ink2); width: 150px; }
/* v3 stage: full-frame scenes revealed by a red slash, kinetic titles on the left */
.scene { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 1; transform: none; overflow: hidden; display: none; }
.bg { position: absolute; inset: 0; }
.bg-dark { background: radial-gradient(90% 80% at 75% 15%, #4A2B1F 0%, #2A1812 42%, #140D0A 100%); }
.bg-paper { background: radial-gradient(60% 60% at 50% 46%, #FBEDE6 0%, #F5F1EC 70%); }
.bg-desk { background: radial-gradient(70% 70% at 22% 85%, #D98A5C 0%, transparent 60%), radial-gradient(70% 70% at 95% 100%, #E0707A 0%, transparent 60%), linear-gradient(155deg, #34479B 0%, #7A5AA8 50%, #C76A86 100%); }
.vp { position: absolute; overflow: hidden; }
.world { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; }
.window { box-shadow: 0 0 0 .5px rgba(0,0,0,.3), 0 24px 70px rgba(0,0,0,.45); }
.title { position: absolute; z-index: 30; color: #fff; }
.title .eye { color: var(--red); font-weight: 700; letter-spacing: .22em; text-transform: uppercase; margin-bottom: 18px; }
.title .eye .num { margin-right: 1.1em; }
.title .h1 { font-weight: 800; letter-spacing: -0.035em; line-height: 1.02; }
.title .ln { overflow: hidden; padding-bottom: .06em; }
.title .ln span { display: inline-block; white-space: nowrap; }
.title .sub { margin-top: 22px; color: #B9AEA8; font-weight: 450; line-height: 1.4; }
.title .chips { margin-top: 34px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.title .chips.row { flex-direction: row; flex-wrap: wrap; }
.title .chip { display: inline-flex; align-items: center; gap: .55em; padding: .5em .95em; border-radius: 999px; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.14); color: #fff; font-weight: 600; opacity: 0; }
.title .chip i { width: .5em; height: .5em; border-radius: 50%; display: block; }
.title .keys { margin-top: 30px; display: flex; gap: 12px; opacity: 0; }
.title .keys + .chips { margin-top: 16px; }
.title .kc { width: 2.1em; height: 2.1em; border-radius: .35em; background: #fff; color: #222; display: flex; align-items: center; justify-content: center; font-weight: 700; box-shadow: 0 .18em 0 rgba(255,255,255,.35); transition: none; }
.title .kc.down { transform: translateY(.12em); box-shadow: 0 .06em 0 rgba(255,255,255,.35); }
.title .foot { margin-top: 18px; color: #8A7F79; font-weight: 500; opacity: 0; }
.sc-card { position: absolute; left: 0; top: 0; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.spark { position: absolute; font-weight: 300; opacity: 0; }
#band { position: absolute; inset: 0; background: var(--red); z-index: 60; display: none; }
.strike { position: absolute; left: -2%; right: -2%; top: 54%; height: .07em; background: #DF4637; transform-origin: 0 50%; transform: scaleX(0); }
.sizepill { white-space: nowrap; padding: .5em 1.2em; border-radius: 999px; color: #8A7F79; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; background: rgba(255,255,255,.06); }
.sizepill.on { background: #fff; color: #1d1d1f; }
.hl { position: absolute; border: 2.5px solid var(--red); box-shadow: 0 0 0 5px rgba(223,70,55,.16); opacity: 0; pointer-events: none; z-index: 80; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ---------- time helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;   // cubic in-out
const eo = x => 1 - Math.pow(1 - x, 3);                                     // cubic out
const lerp = (a, b, u) => a + (b - a) * u;
const $ = (root, sel) => root.querySelector(sel);

// ---------- icons (simplified SF Symbols) ----------
const I = {
  link: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>',
  photo: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16a1.5 1.5 0 0 1 1.5 1.5v11A1.5 1.5 0 0 1 20 19H4a1.5 1.5 0 0 1-1.5-1.5v-11A1.5 1.5 0 0 1 4 5zm1.5 11.5h13l-4.2-5.6-3.3 4.2-2.2-2.6z"/><circle cx="8" cy="9" r="1.7" fill="#fff" opacity=".9"/></svg>',
  doc: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M6 2.5h8l5 5v13a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20.5v-16A2 2 0 0 1 6 2.5z"/><path d="M14 2.5v5h5" fill="#fff" opacity=".55"/></svg>',
  lines: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg>',
  wand: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20 15 9"/><path d="M17 3v3M15.5 4.5h3M20 9v2M19 10h2M11 4v2M10 5h2"/></svg>',
  search: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>',
  clock: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v4h4"/><path d="M12 8v4l3 2"/></svg>',
  stack: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="5" y="8" width="14" height="12" rx="2"/><path d="M7 5h10M9 2.5h6"/></svg>',
  folder: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7.5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  drive: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="9" rx="2"/><path d="M12 13v4M5 20h14M8 20v-3h8v3"/></svg>',
  plus: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  sidebar: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M9 5v14"/></svg>',
  lock: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.7-1.5"/></svg>',
  frame: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="7" width="13" height="13" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg>',
  grid: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/></svg>',
  list: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.1M4.5 12h.1M4.5 18h.1"/></svg>',
  arrange: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="5" height="4" rx="1"/><rect x="10" y="5" width="5" height="4" rx="1"/><rect x="17" y="5" width="4" height="4" rx="1"/><rect x="3" y="11" width="5" height="4" rx="1"/><rect x="10" y="11" width="5" height="4" rx="1"/><rect x="17" y="11" width="4" height="4" rx="1"/></svg>',
  trash: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13"/></svg>',
  tray: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10m-4-4 4 4 4-4"/><path d="M3 14h5l1.5 3h5L16 14h5v5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19z"/></svg>',
  check: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  chev: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m7 10 5 5 5-5"/></svg>',
  pin: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M8 3h8l-1.3 6 3.3 3H6l3.3-3zM11.3 12h1.4v9h-1.4z"/></svg>',
  arrow: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M6 3.5 18.5 12 12.6 13l3.4 7-2.4 1.1-3.3-7.1L6 18z"/></svg>',
  hand: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12m0-6.5V5a1.5 1.5 0 0 1 3 0v7m0-5.5a1.5 1.5 0 0 1 3 0V13m0-4a1.5 1.5 0 0 1 3 0v5a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-2.7L4.5 14a1.5 1.5 0 0 1 2.5-1.7L8 14"/></svg>',
  minus: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  play: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
  camera: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3"/><circle cx="12" cy="12" r="3"/></svg>',
  wifi: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 9.5a13 13 0 0 1 18 0M6.5 13a8 8 0 0 1 11 0M10 16.5a3 3 0 0 1 4 0"/></svg>',
  battery: '<svg class="ic" viewBox="0 0 28 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="7" width="21" height="10" rx="3"/><rect x="4" y="9" width="15" height="6" rx="1.5" fill="currentColor" stroke="none"/><path d="M25 10.5v3"/></svg>',
  knife: '<svg class="ic" viewBox="0 0 24 24"><path d="M10 13 19 4.5c.6 2.6-2.4 7.2-6 9z" fill="currentColor"/><rect x="3" y="12.5" width="15" height="5.2" rx="2.6" fill="currentColor"/><circle cx="15.3" cy="15.1" r="1" fill="#fff"/></svg>',
};
const kindStyle = {
  photos: { color: 'var(--k-photos)', sym: I.photo, name: 'PhotoBook' },
  linker: { color: 'var(--k-linker)', sym: I.link, name: 'Linker' },
  notes:  { color: 'var(--k-notes)',  sym: I.lines, name: 'Notepad' },
  files:  { color: 'var(--k-files)',  sym: I.doc, name: 'Files' },
  classic:{ color: null, sym: '', name: 'Folder' },
};

// The folder icon ("Dot" design, FolderViews.swift): Finder-blue folder, a coloured kind dot in the corner.
function folderIcon(kind, s, opts = {}) {
  const k = kindStyle[kind]; const d = s * 0.3;
  return `<div class="ficon" style="width:${s}px;height:${s * .8}px">
    <div class="back1" style="width:${s * .4}px;height:${s * .16}px;border-radius:${s * .06}px ${s * .06}px 0 0"></div>
    <div class="back2" style="top:${s * .1}px;border-radius:${s * .08}px"></div>
    <div class="front" style="top:${s * .24}px;border-radius:${s * .08}px"></div>
    ${k.color ? `<div class="kdot" style="width:${d}px;height:${d}px;right:${-s * .04}px;bottom:${-s * .04}px;background:${k.color};font-size:${d * .52}px">${k.sym}</div>` : ''}
    ${opts.num ? `<div class="num">${opts.num}</div>` : ''}
    ${opts.count != null ? `<div class="count" data-count>${opts.count}</div>` : ''}
  </div>`;
}
function folderTile(kind, name, x, y, opts = {}) {
  return `<div class="ftile" style="left:${x}px;top:${y}px" ${opts.id ? `id="${opts.id}"` : ''}>${folderIcon(kind, 64, opts)}
    <div class="label">${opts.tag ? `<span class="dotc" style="background:${opts.tag};margin-right:5px"></span>` : ''}${name}</div></div>`;
}

// The cursor (macOS arrow).

// Cursor path: [t, x, y, click?]. Eased moves with a slight arc; a click presses for a moment.
function moveCursor(sc, keys, t) {
  const c = sc.cursor;
  if (!keys) { c.style.opacity = 0; return; }
  let x = keys[0][1], y = keys[0][2];
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, x0, y0] = keys[i], [t1, x1, y1] = keys[i + 1];
    if (t >= t0 && t <= t1) {
      const u = io(seg(t, t0, t1)), arc = Math.sin(Math.PI * u) * 0.08;
      const dx = x1 - x0, dy = y1 - y0;
      x = lerp(x0, x1, u) - dy * arc; y = lerp(y0, y1, u) + dx * arc;
    } else if (t > t1) { x = x1; y = y1; }
  }
  let press = 0, ring = 0;
  for (const k of keys) if (k[3]) {
    const d = t - k[0];
    if (d > -0.06 && d < 0.16) press = 1;
    if (d >= 0 && d < 0.5) ring = 1 - d / 0.5;
  }
  c.style.opacity = 1;
  c.style.transform = `translate(${x - 3}px, ${y - 3}px) scale(${press ? 0.88 : 1})`;
  const r = c.querySelector('.ring');
  r.style.borderColor = `rgba(10,122,255,${0.35 * ring})`;
  r.style.transform = `scale(${0.6 + (1 - ring) * 0.6})`;
}

// ---------- scenes ----------
// A scene is a full frame: its own background, a world viewport (camera, cursor, rings) and a title block.
// It enters with a red diagonal wipe (or a fade) at a, and stays drawn until the next one has covered it.
const scenes = [];
const WIPE = 0.5;
function scene(o) {
  const el = document.createElement('div'); el.className = 'scene';
  el.innerHTML = `<div class="bg bg-${o.bg}"></div>`;
  if (o.html) {
    el.innerHTML += `<div class="vp" style="left:${L.x}px;top:${VERTICAL && o.vtop != null ? o.vtop : L.y}px;width:${L.w}px;height:${L.h}px"><div class="world">${o.html}${cursorHTML}</div></div>`;
  }
  if (o.stage) el.innerHTML += o.stage;
  if (o.title) el.appendChild(titleBlock(o.title));
  stage.appendChild(el);
  el.style.display = 'block'; // laid out until the first seek, so at() can measure
  if (o.title) { // a long line shrinks the title until it fits its column
    const h = $(el, '.title .h1'); let fs = T.h1;
    while (fs > 40 && [...h.querySelectorAll('.ln span')].some(s => s.offsetWidth > T.w)) h.style.fontSize = (fs -= 2) + 'px';
  }
  const sc = Object.assign({ el, enter: 'wipe' }, o);
  sc.vp = $(el, '.vp'); sc.world = sc.vp && $(el, '.world'); sc.cursor = sc.world && $(sc.world, '.cursor');
  scenes.push(sc);

}
// Centre of an element in world coordinates (valid before the first seek, when worlds are unscaled).
function at(sc, sel, dx = 0, dy = 0) {

  return { x: r.left - v.left + r.width / 2 + dx, y: r.top - v.top + r.height / 2 + dy };
}
function box(sc, sel) {
  const r = $(sc.world, sel).getBoundingClientRect(), v = sc.vp.getBoundingClientRect();
  return { x: r.left - v.left, y: r.top - v.top, w: r.width, h: r.height };
}
// Red highlight rings: [a, b, box or selector, pad, radius] in scene time.
function rings(sc, list) {
  sc.rings = list.map(([a, b, bx, pad = 8, rad = 14]) => {
    if (typeof bx === 'string') bx = box(sc, bx);
    const d = document.createElement('div'); d.className = 'hl';

    sc.world.insertBefore(d, sc.cursor);
    return { a, b, d };
  });
}
// Camera keys: [t, zoom, cx, cy] in scene time.
function cam(keys, t) {
  let k = keys[0];
  if (t >= keys[keys.length - 1][0]) k = keys[keys.length - 1];
  else for (let i = 0; i < keys.length - 1; i++) if (t >= keys[i][0] && t <= keys[i + 1][0]) {
    const u = io(seg(t, keys[i][0], keys[i + 1][0]));
    k = [t, lerp(keys[i][1], keys[i + 1][1], u), lerp(keys[i][2], keys[i + 1][2], u), lerp(keys[i][3], keys[i + 1][3], u)];
  }
  let [, z, cx, cy] = k;
  const S = K * z, hw = L.w / 2 / S, hh = L.h / 2 / S;

  return `translate(${L.w / 2 - cx * S}px, ${L.h / 2 - cy * S}px) scale(${S})`;
}

      const fw = $(el, '#fwin'), u = eo(seg(t, FIND, FIND + 0.4)); fw.style.opacity = u; fw.style.transform = `translateY(${(1 - u) * 24}px)`;
      $(el, '#frow2').style.background = `rgba(10,122,255,${0.22 * (t > FIND + 0.3 ? 1 - seg(t, 4.6, 5.3) : 0)})`;
    },
    camera: [[0, 1, 640, 360], [5.5, 1.03, 660, 360]],
    vcam: [[0, 1, 760, 330], [OPENC + 0.2, 1, 760, 330], [OPENC + 0.7, 1, 860, 330], [FIND, 1, 860, 330], [FIND + 0.5, 1.08, 990, 470]] });
  const n = at(sc, '#t2 .tn', 10, 2), side = at(sc, '[data-side="connected"]', -20);
  sc.cursorKeys = [[0, 1050, 660], [OPENC - 0.15, side.x, side.y], [OPENC, side.x, side.y, 1], [SELT - 0.12, n.x, n.y], [SELT, n.x, n.y, 1], [DONE + 0.3, 1180, 330], [5.5, 1180, 330]];
  rings(sc, [[OPENC - 0.25, OPENC + 0.5, '[data-side="connected"]', 3, 9], [FIND + 0.35, 4.9, '#frow2', 3, 8]]);
}

// ================= The Frame: references beside the work (24–32) =================
{
  const E = { x: 470, y: 60, w: 740, h: 600 }, FR = { x: 790, y: 96, w: 420, h: 540 }, LIB = 130;
  const T0 = 'Found in 2007 on the Yamal Peninsula in Siberia, ', T1 = 'Lyuba is the best-preserved ', T2 = 'mammoth calf ever found. She was about a month old. Hang her photo at eye level.';
  const libRows = [
    ['lib-p', img('lyuba.jpg', 30, 30), 'Lyuba – hero print.jpg'],
    ['', img('adams.jpg', 30, 30), 'adams-mammoth-vienna.jpg'],
    ['', img('wiki-skeleton.jpg', 30, 30), 'Siegsdorf skeleton'],
    ['', `<div style="width:30px;height:30px;background:var(--k-linker);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center">${I.link}</div>`, 'en.wikipedia.org'],
  ].map(([id, th, n]) => `<div ${id ? `id="${id}"` : ''} style="display:flex;align-items:center;gap:7px;height:38px;padding:0 5px;font-size:11px;border-radius:6px"><div class="th" style="width:30px;height:30px;border-radius:6px;overflow:hidden;flex:none">${th}</div><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0">${n}</span></div>`).join('');
  const pause = '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
  const html = `<div class="window" id="editor" style="left:${E.x}px;top:${E.y}px;width:${E.w}px;height:${E.h}px;background:#fff;${DIM}">
    <div style="height:38px;background:#F4F4F3;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;font-size:13px">
      <div class="lights" id="elights"><i></i><i></i><i></i></div><span style="margin-left:70px;font-weight:600">Exhibit labels</span><span style="color:var(--ink3);margin-left:8px">— Edited</span></div>
    <div class="abs" style="left:34px;top:70px;width:270px;font:400 15px/1.55 'DejaVu Serif', Georgia, serif;color:#222">
      <div style="font:700 26px/1.2 Inter;letter-spacing:-0.02em;margin-bottom:14px">Lyuba</div>
      <div style="font:600 11px Inter;letter-spacing:.14em;color:#999;text-transform:uppercase;margin-bottom:10px">Baby woolly mammoth · about 42,000 years old</div>
      <span id="etext"></span><span id="caret" style="display:inline-block;width:1.5px;height:17px;background:#222;vertical-align:-3px"></span></div></div>
  <div class="window" id="frame" style="left:${FR.x}px;top:${FR.y}px;width:${FR.w}px;height:${FR.h}px;background:#EDEDEC;transform-origin:70% 0;${DIM}">
    <div style="height:38px;display:flex;align-items:center;gap:11px;padding:0 12px;border-bottom:1px solid var(--line);color:var(--ink2);font-size:13px">
      <div class="lights"><i></i><i></i><i></i></div><span style="color:var(--accent)">${I.frame}</span><span style="font-size:12px;font-weight:600;color:#1d1d1f">The Frame</span>
      <span style="margin-left:auto;background:rgba(0,0,0,.06);border-radius:7px;padding:3px 6px;display:flex;gap:8px"><span style="color:var(--accent)">${I.arrow}</span><span>${I.hand}</span></span><span style="font-size:11px;font-weight:500">100%</span></div>
    <div class="abs" id="lib" style="left:0;top:38px;bottom:0;width:${LIB}px;border-right:1px solid var(--line);padding:8px 6px">
      <div class="pill" style="background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08);height:24px;font-size:11.5px">${I.folder} Mammoth<span style="margin-left:auto;color:var(--accent)">${I.chev}</span></div>
      <div style="height:6px"></div>${libRows}</div>
    <div class="abs" id="canvas" style="left:${LIB}px;top:38px;right:0;bottom:0;background-color:#E4E4E3;background-image:radial-gradient(rgba(0,0,0,.16) 1px, transparent 1.2px);background-size:20px 20px;overflow:hidden">
      <div class="abs" id="fimg" style="left:14px;top:14px;width:150px;height:104px;border-radius:6px;overflow:hidden;opacity:0;box-shadow:0 2px 10px rgba(0,0,0,.18)">${img('lyuba.jpg', 150, 104)}</div>
      <div class="abs" id="fnote" style="left:176px;top:14px;width:100px;min-height:96px;padding:10px 11px;border-radius:8px;background:var(--note);font-size:12.5px;line-height:1.35;opacity:0;box-shadow:0 1px 3px rgba(0,0,0,.08)"><span id="fnt"></span></div>
      <div class="abs" id="video" style="left:14px;top:134px;width:262px;height:170px;border-radius:8px;overflow:hidden;background:#111;opacity:0;box-shadow:0 2px 10px rgba(0,0,0,.2)">
        <img id="vimg" src="${A}adams.jpg" style="position:absolute;left:0;top:0;width:400px;height:285px;transform-origin:0 0">
        <div class="abs" style="left:0;right:0;top:0;height:34px;background:linear-gradient(rgba(0,0,0,.55),transparent);color:#fff;font:600 11px Inter;padding:8px 10px">Tutorial: writing museum labels</div>
        <div class="abs" id="vbig" style="left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;padding-left:3px">${I.play}</div>
        <div class="abs" id="vctl" style="left:8px;right:8px;bottom:8px;height:26px;border-radius:8px;background:rgba(40,40,42,.62);display:flex;align-items:center;gap:8px;padding:0 9px;color:#fff;font-size:12px;opacity:0">
          <span style="width:14px;display:flex;justify-content:center">${pause}</span>
          <div style="flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.3)"><div id="vprog" style="height:100%;width:2%;background:#fff;border-radius:2px"></div></div>
          <span id="vtime" style="font-size:10.5px;font-variant-numeric:tabular-nums">0:00</span></div></div>
    </div></div>
  <div class="abs" id="ghost" style="width:72px;height:50px;border-radius:5px;overflow:hidden;opacity:0;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:90">${img('lyuba.jpg', 72, 50)}</div>
  <div class="key" id="k-n" style="left:${FR.x + 150}px;top:${FR.y + 380}px">⌘N</div><div class="key" id="k-v" style="left:${FR.x + 150}px;top:${FR.y + 380}px">⌘V</div>`;
  const UP = 0.55, GRAB = 1.25, DROP = 2.0, NEWN = 2.4, PASTE = 3.6, PLAY = 4.25, BACK = 5.05;
  const NT = 'Under 60 words. Big type.';
  const sc = scene({ a: 24, b: 32, bg: 'desk', html,
    title: { eye: 'The Frame', lines: ['Keep your', 'references beside', 'your work.'] },
    update(t, el) {
      // The work: typing goes on underneath, before and after the Frame is used.
      const typed = T0 + T1.slice(0, Math.floor(clamp(t / 1.0) * T1.length)) + T2.slice(0, Math.floor(clamp((t - BACK - 0.15) / 3.0) * T2.length));
      $(el, '#etext').textContent = typed;
      const typing = t < 1.0 || t > BACK + 0.15;
      $(el, '#caret').style.opacity = typing || Math.floor(t * 2.2) % 2 ? 1 : 0;
      $(el, '#elights').classList.toggle('off', t > UP && t < BACK);
      // The Frame comes up above it.
      const f = $(el, '#frame'), u = eo(seg(t, UP, UP + 0.35)); f.style.opacity = u; f.style.transform = `scale(${0.92 + 0.08 * u})`;
      $(el, '#lib-p').style.background = t > GRAB && t < DROP + 0.3 ? 'rgba(10,122,255,.16)' : 'transparent';
      dragGhost(sc, $(el, '#ghost'), GRAB, DROP, t);
      land($(el, '#fimg'), t, DROP);
      land($(el, '#fnote'), t, NEWN + 0.1);
      $(el, '#fnt').textContent = NT.slice(0, Math.floor(clamp((t - NEWN - 0.3) / 0.8) * NT.length));
      land($(el, '#video'), t, PASTE + 0.1);
      keyAt($(el, '#k-n'), t, NEWN); keyAt($(el, '#k-v'), t, PASTE);
      // The tutorial plays (a slow move through a museum hall photo).
      const vt = Math.max(0, t - PLAY), playing = t > PLAY;
      $(el, '#vimg').style.transform = `translate(${-vt * 16}px, ${-vt * 6}px) scale(${1 + vt * 0.03})`;
      $(el, '#vbig').style.opacity = playing ? 0 : 1;
      $(el, '#vctl').style.opacity = playing ? 1 - seg(t, PLAY + 1.4, PLAY + 1.8) : 0;
      $(el, '#vprog').style.width = (2 + vt * 3) + '%';
      $(el, '#vtime').textContent = '0:0' + Math.floor(vt);
    },
    camera: [[0, 1, 640, 360], [8.5, 1.03, 660, 360]],
    vcam: [[0, 0.95, 850, 360], [8.5, 0.95, 850, 360]] });
  const lib = at(sc, '#lib-p', -30), dp = at(sc, '#fimg'), pl = at(sc, '#vbig'), et = { x: E.x + 34 + 200, y: E.y + 70 + 150 };
  sc.cursorKeys = [[0, 600, 560], [GRAB - 0.2, lib.x, lib.y], [GRAB, lib.x, lib.y, 1], [DROP, dp.x, dp.y], [PASTE - 0.25, dp.x + 60, dp.y + 160], [PLAY - 0.2, pl.x, pl.y], [PLAY, pl.x, pl.y, 1],
    [BACK - 0.15, et.x, et.y], [BACK, et.x, et.y, 1], [8.5, et.x - 30, et.y + 80]];
  rings(sc, [[UP + 0.2, UP + 0.9, '#frame', 4, 14], [DROP + 0.05, DROP + 0.7, '#fimg', 3, 10], [PLAY + 0.1, PLAY + 0.8, '#video', 4, 12]]);
}

// ================= Three sizes: pop-up, window, full screen (32–36) =================
{
  const R = [{ x: 860, y: 110, w: 300, h: 420 }, { x: 470, y: 90, w: 780, h: 520 }, { x: 0, y: 0, w: 1280, h: 720 }];
  const items = [['folder', 'photos', 'PhotoBook', 3], ['folder', 'linker', 'Linker', 1], ['folder', 'notes', 'Notepad', 1], ['folder', 'files', 'Files', 2],
    ['pic', 'cave.jpg'], ['pic', 'skeleton.jpg'], ['pic', 'skull.jpg'], ['pic', 'tilesius.jpg'], ['pic', 'adams.jpg'], ['pic', 'lyuba.jpg']];
  const grid = items.map(([k, a, b, n]) => k === 'folder'
    ? `<div class="gi" style="width:90px;text-align:center;font-size:12px;font-weight:500;color:#2a2a2c">${folderIcon(a, 54, { count: n })}<div style="margin-top:6px">${b}</div></div>`
    : `<div class="gi gp" style="border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.2)"><img src="${A}${a}" style="width:100%;height:100%;object-fit:cover;display:block"></div>`).join('');
  const html = `<div class="window" id="grow" style="${DIM}">
    <div style="height:38px;display:flex;align-items:center;gap:9px;padding:0 12px;background:rgba(0,0,0,.035);border-bottom:1px solid var(--line);font-size:12.5px">
      <div class="lights" id="glights"><i></i><i></i><i id="green"></i></div>
      <span style="height:24px;border-radius:7px;background:rgba(10,122,255,.14);display:flex;align-items:center;gap:5px;padding:0 9px;font-weight:600;margin-left:6px"><span style="font-size:10px;color:var(--ink2)">${I.pin}</span>Mammoth</span></div>
    <div id="ggrid" style="display:flex;flex-wrap:wrap;gap:18px 14px;padding:18px 16px;align-content:flex-start">${grid}</div></div>`;
  const label = `<div class="abs" id="sizelabel" style="left:50%;bottom:${VERTICAL ? 140 : 70}px;transform:translateX(-50%);display:flex;gap:10px">
    ${['Pop-up', 'Window', 'Full screen'].map((n, i) => `<span class="sizepill" data-i="${i}" style="font-size:${T.chip - 2}px">${n}</span>`).join('')}</div>`;
  const STEP = [1.05, 2.05];
  const sc = scene({ a: 32, b: 36, bg: 'dark', html, stage: label,
    title: { eye: 'Three sizes', lines: ['Just the space', 'you need.'], out: 2.0 },
    update(t, el) {
      const u1 = io(seg(t, STEP[0], STEP[0] + 0.45)), u2 = io(seg(t, STEP[1], STEP[1] + 0.5));
      const a = t < STEP[1] ? R[0] : R[1], b = t < STEP[1] ? R[1] : R[2], u = t < STEP[1] ? u1 : u2;
      const g = $(el, '#grow');
      Object.assign(g.style, { left: lerp(a.x, b.x, u) + 'px', top: lerp(a.y, b.y, u) + 'px', width: lerp(a.w, b.w, u) + 'px', height: lerp(a.h, b.h, u) + 'px', borderRadius: (t > STEP[1] ? lerp(11, 0, u2) : 11) + 'px' });
      const W = lerp(a.w, b.w, u), pw = W < 400 ? 76 : W < 900 ? 150 : 200;
      el.querySelectorAll('.gp').forEach(p => { p.style.width = pw + 'px'; p.style.height = pw * 0.7 + 'px'; });
      const step = t < STEP[0] + 0.2 ? 0 : t < STEP[1] + 0.2 ? 1 : 2;
      el.querySelectorAll('.sizepill').forEach(p => p.classList.toggle('on', +p.dataset.i === step));
      $(el, '#sizelabel').style.opacity = eo(seg(t, 0.3, 0.6));
      g.style.opacity = eo(seg(t, 0.1, 0.4));
    },
    camera: [[0, 1, 640, 360]], vcam: [[0, 1, 1000, 360], [STEP[0], 1, 1000, 360], [STEP[0] + 0.5, 1, 860, 360], [STEP[1], 1, 860, 360], [STEP[1] + 0.5, 1, 640, 360]] });
  // The cursor follows the green light as the window grows.
  sc.cursorKeys = [[0, 1100, 640], [0.85, 860 + 54, 110 + 19], [STEP[0], 860 + 54, 110 + 19, 1], [1.85, 470 + 54, 90 + 19], [STEP[1], 470 + 54, 90 + 19, 1], [2.7, 700, 420], [4.5, 700, 420]];
}

// ================= Closing: the logo, the line, the three verbs (36–40) =================
{
  let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const sparks = Array.from({ length: 26 }, () => ({ x: rnd() * SW, y: rnd() * SH, s: 10 + rnd() * 14, p: rnd() * 6, c: rnd() > 0.5 ? 'var(--red)' : '#E8A79E' }));
  const ip = VERTICAL ? 150 : 110, H = VERTICAL ? 104 : 100;
  const lines = VERTICAL ? ['Keep your ideas', 'moving.'] : ['Keep your ideas moving.'];
  const verbs = ['Collect.', 'Organize.', 'Keep working.'];
  scene({ a: 36, b: 40, bg: 'paper', stage: `
    ${sparks.map(s => `<div class="spark" style="left:${s.x}px;top:${s.y}px;font-size:${s.s}px;color:${s.c}">+</div>`).join('')}
    <div class="abs" style="left:0;top:0;width:${SW}px;height:${SH}px;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div id="clock" style="display:flex;align-items:center;gap:${ip * 0.22}px">
        <img id="cicon" src="icon.png" style="width:${ip}px;height:${ip}px;border-radius:${ip * .225}px;box-shadow:0 2px 4px rgba(0,0,0,.06),0 12px 30px rgba(76,46,33,.18)">
        <div style="overflow:hidden"><div id="cword" style="font:800 ${ip * 0.72}px/1.05 Inter;letter-spacing:-0.045em;color:#2B1C16">Swiss</div></div></div>
      <div style="margin-top:${ip * 0.5}px;text-align:center;font:800 ${H}px/1.06 Inter;letter-spacing:-0.035em;color:#2B1C16">
        ${lines.map(l => `<div style="overflow:hidden;padding-bottom:.06em"><div class="cln" style="white-space:nowrap">${l}</div></div>`).join('')}</div>
      <div style="margin-top:${H * 0.36}px;display:flex;gap:.6em;font:600 ${VERTICAL ? 40 : 34}px Inter;color:#8A7F79">
        ${verbs.map((v, i) => `<span class="cv" style="${i === 2 ? 'color:var(--red)' : ''}">${v}</span>`).join('')}</div>
    </div>`,
    update(t, el) {
      const ic = $(el, '#cicon'), u = seg(t, 0.45, 0.9);
      ic.style.opacity = eo(seg(t, 0.45, 0.65)); ic.style.transform = `scale(${0.5 + 0.5 * eo(u) + 0.1 * Math.sin(Math.PI * u)})`;
      $(el, '#cword').style.transform = `translateX(${(1 - eo(seg(t, 0.7, 1.15))) * -105}%)`;
      el.querySelectorAll('.cln').forEach((l, i) => l.style.transform = `translateY(${(1 - eo(seg(t, 1.0 + i * 0.1, 1.5 + i * 0.1))) * 105}%)`);
      el.querySelectorAll('.cv').forEach((v, i) => { const w = eo(seg(t, 1.6 + i * 0.22, 1.95 + i * 0.22)); v.style.opacity = w; v.style.transform = `translateY(${(1 - w) * 14}px)`; v.style.display = 'inline-block'; });
      el.querySelectorAll('.spark').forEach((s, i) => {
        const sp = sparks[i], v = Math.max(0, Math.sin((t * 1.2 + sp.p)));
        s.style.opacity = v * 0.7 * seg(t, 0.6, 1.2); s.style.transform = `translateY(${-t * 10}px) rotate(${t * 30 + i * 20}deg)`;
      });
    } });
}

// ================= seek =================
window.DURATION = 40.0;
const band = document.createElement('div'); band.id = 'band'; stage.appendChild(band);
window.seek = function (t) {
  let bandOn = false;
  scenes.forEach((sc, i) => {
    const next = scenes[i + 1];
    const end = next ? next.a + (next.enter === 'wipe' ? WIPE : 0.35) : DURATION + 1;
    const on = t >= sc.a && t < end;
    sc.el.style.display = on ? 'block' : 'none';
    if (!on) return;
    sc.el.style.zIndex = i + 1;
    const lt = t - sc.a;
    // Entering: a red slash crosses the frame and the new scene is revealed behind it.
    if (sc.enter === 'wipe' && lt < WIPE) {
      const u = io(lt / WIPE), sk = SH * 0.22, e = lerp(-sk - 40, SW + sk + 40, u);
      sc.el.style.clipPath = `polygon(0 0, ${e + sk}px 0, ${e - sk}px ${SH}px, 0 ${SH}px)`;
      band.style.clipPath = `polygon(${e + sk}px 0, ${e + sk + 34}px 0, ${e - sk + 34}px ${SH}px, ${e - sk}px ${SH}px)`;
      bandOn = true;
    } else sc.el.style.clipPath = 'none';
    sc.el.style.opacity = sc.enter === 'fade' ? io(seg(lt, 0, 0.35)) : 1;
    if (sc.world) {
      sc.world.style.transform = cam(VERTICAL && sc.vcam ? sc.vcam : sc.camera, lt);
      moveCursor(sc, sc.cursorKeys, lt);
      ringsDraw(sc, lt);
    }
    if (sc.update) sc.update(lt, sc.el);
    drawTitle(sc, lt);
  });
  band.style.display = bandOn ? 'block' : 'none';
};
window.seek(params.has('t') ? +params.get('t') : 0);

</script>
